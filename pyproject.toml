[project]
name = "do-app-sandbox"
version = "0.1.0"
description = "Experimental sandbox API for DigitalOcean App Platform - provides sandbox-like capabilities similar to Cloudflare Sandbox"
requires-python = ">=3.10"
dependencies = [
    "pexpect>=4.9.0",
]

[project.scripts]
sandbox = "do_app_sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/do_app_sandbox"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
spaces = [
    "boto3>=1.34.0",
]
all = [
    "boto3>=1.34.0",
]
