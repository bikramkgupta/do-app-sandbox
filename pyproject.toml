[project]
name = "do-app-sandbox"
version = "0.2.2"
description = "Experimental sandbox API for DigitalOcean App Platform - provides sandbox-like capabilities similar to Cloudflare Sandbox"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10.12"
authors = [
    {name = "Bikram Gupta", email = "bikram.gupta@gmail.com"}
]
keywords = ["digitalocean", "sandbox", "app-platform", "containers", "cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pexpect>=4.9.0",
]

[project.scripts]
sandbox = "do_app_sandbox.cli:main"

[project.urls]
Homepage = "https://github.com/bikramkgupta/do-app-sandbox"
Documentation = "https://github.com/bikramkgupta/do-app-sandbox#readme"
Repository = "https://github.com/bikramkgupta/do-app-sandbox"
Issues = "https://github.com/bikramkgupta/do-app-sandbox/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27.0",
    "boto3>=1.42.97",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "python-dotenv>=1.0.0",
]
spaces = [
    "boto3>=1.42.97",
]
all = [
    "boto3>=1.42.97",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/tests",
    "/images",
    "/scripts",
    "/docs",
    "/.env*",
    "/Agent.md",
    "/Claude.md",
    "/App_Platform_Commands.md",
    "/*.txt",
    "/.gitignore",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/do_app_sandbox"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27.0",
    "boto3>=1.42.97",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "python-dotenv>=1.0.0",
]

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]
exclude = ["images/"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "S",      # flake8-bandit (security)
    "BLE",    # flake8-blind-except
    "A",      # flake8-builtins
    "T20",    # flake8-print
]
ignore = [
    "S101",   # assert usage (OK in tests)
    "S603",   # subprocess calls (needed for doctl)
    "S607",   # partial executable path (needed for doctl)
    "S108",   # /tmp usage (OK for sandbox temp files)
    "S110",   # try-except-pass (used intentionally in cleanup)
    "S105",   # hardcoded password detection (false positive on env var names)
    "S310",   # URL scheme audit (we validate URLs ourselves)
    "B904",   # exception chaining (TODO: fix incrementally)
    "BLE001", # broad exception catching (intentional for defensive error handling)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", "T20", "S106", "S311",  # Allow asserts, prints, test credentials, random
    "E501",  # Long lines (test assertions can be verbose)
    "E741",  # Ambiguous variable names (short names OK in tests)
    "F841",  # Unused variables (often used for side effects in tests)
    "F401",  # Unused imports (often imported for type hints or fixtures)
    "E402",  # Module level imports (test setup may require non-top imports)
    "A004",  # Shadowing builtins (importing our ConnectionError)
    "C401",  # Set comprehension style (not critical in tests)
    "B007",  # Unused loop variables (often intentional in tests)
]
"src/do_app_sandbox/cli.py" = ["T201", "BLE001"]  # CLI uses print, catches broad exceptions for UX
"src/do_app_sandbox/__init__.py" = ["A004"]  # Re-exports ConnectionError
"src/do_app_sandbox/image_registry.py" = ["T201", "BLE001"]  # CLI helper
"src/do_app_sandbox/image_validator.py" = ["T201"]  # CLI helper uses print
"src/do_app_sandbox/exceptions.py" = ["A001"]  # ConnectionError intentionally shadows builtin
"src/do_app_sandbox/executor.py" = ["A004"]  # Imports our ConnectionError

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = false
no_implicit_optional = false
exclude = [
    "tests/",
    "build/",
    "dist/",
    "images/",
]

# TODO: Fix type errors incrementally and remove these overrides
[[tool.mypy.overrides]]
module = [
    "do_app_sandbox.manager",
    "do_app_sandbox.cli",
    "do_app_sandbox.async_sandbox",
    "do_app_sandbox.adaptive_pool",
    "do_app_sandbox.filesystem",
]
ignore_errors = true
