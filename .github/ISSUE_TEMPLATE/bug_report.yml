name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concise description of the bug and expected behavior.
      placeholder: What happened and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide exact steps and code/commands if possible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and traceback
      description: Paste relevant logs and stack traces.
      render: shell

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 0.2.2

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Python 3.10
        - Python 3.11
        - Python 3.12
        - Python 3.13
        - Other

  - type: markdown
    attributes:
      value: |
        Security-sensitive issues should not be reported publicly. Please follow SECURITY.md.
